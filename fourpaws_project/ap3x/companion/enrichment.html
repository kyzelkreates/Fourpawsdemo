<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#3a7d44"/>
<title>🧩 Enrichment — Four Paws</title>
<link rel="stylesheet" href="./app.css"/>
<style>
.enrich-card { background:var(--surface); border-radius:var(--r); border:1.5px solid var(--border); padding:15px; display:flex; gap:13px; box-shadow:var(--shadow); margin-bottom:10px; transition:box-shadow var(--t); }
.enrich-card:hover { box-shadow:var(--shadow-lg); }
.enrich-card.done { opacity:.7; }
.enrich-icon { font-size:30px; flex-shrink:0; }
.enrich-info { flex:1; min-width:0; }
.enrich-info h3 { font-size:15px; font-weight:700; margin-bottom:3px; }
.enrich-info p { font-size:13px; color:var(--muted); margin-bottom:7px; line-height:1.4; }
.enrich-meta { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:7px; }
.enrich-pill { padding:2px 9px; border-radius:99px; font-size:11px; font-weight:600; background:var(--surface2); color:var(--muted); }
.enrich-tip  { font-size:12px; color:var(--primary); background:var(--primary-xl); border-radius:var(--sm); padding:6px 9px; line-height:1.45; }
.enrich-side { display:flex; flex-direction:column; gap:8px; align-items:flex-end; justify-content:flex-start; flex-shrink:0; }
.btn-start { padding:9px 16px; border-radius:var(--rs); background:var(--accent); color:#fff; border:none; font-size:13px; font-weight:700; cursor:pointer; transition:all var(--t); white-space:nowrap; }
.btn-start:hover { background:var(--accent-d); transform:translateY(-1px); }
.done-badge { padding:7px 12px; border-radius:var(--rs); background:#d1fae5; color:#065f46; font-size:12px; font-weight:700; }

/* Runner overlay */
.runner-overlay { position:fixed; inset:0; background:rgba(10,26,14,.92); z-index:500; display:flex; align-items:center; justify-content:center; animation:fadeIn .2s ease; }
.runner-box { background:var(--surface); border-radius:20px; padding:32px 24px; max-width:340px; width:90%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4); }
.runner-title  { font-size:18px; font-weight:800; margin-bottom:22px; }
.runner-visual { position:relative; display:flex; align-items:center; justify-content:center; height:110px; margin-bottom:16px; }
.runner-circle { width:90px; height:90px; border-radius:50%; background:var(--primary); transition:all 1s ease; }
.runner-circle.inhale { transform:scale(1.28); background:var(--primary); }
.runner-circle.hold   { transform:scale(1.28); background:var(--accent); }
.runner-circle.exhale { transform:scale(.82);  background:var(--primary-d); }
.runner-timer  { position:absolute; font-size:24px; font-weight:900; color:#fff; pointer-events:none; }
.runner-instr  { font-size:18px; font-weight:700; margin-bottom:6px; }
.runner-prog   { font-size:13px; color:var(--muted); margin-bottom:20px; }
</style>
</head>
<body class="theme-light" data-page="enrichment">

<header class="fp-header">
  <div class="header-left">
    <a href="./index.html" class="back-btn">← Home</a>
  </div>
  <div class="header-right">
    <span class="xp-chip" id="xp-chip">⚡ 0 XP</span>
    <button class="btn-icon" id="theme-toggle">🌙</button>
  </div>
</header>

<div id="streak-banner" class="streak-banner" style="display:none"><span id="streak-text"></span></div>

<main class="page-shell animate-in">
  <h2 class="page-title">🧩 Enrichment Activities</h2>
  <p class="page-sub">Mental stimulation, confidence &amp; structured play</p>

  <div class="filter-row" id="filter-row">
    <button class="filter-btn active" onclick="filterActs('all',this)">All</button>
    <button class="filter-btn" onclick="filterActs('scent',this)">👃 Scent</button>
    <button class="filter-btn" onclick="filterActs('puzzle',this)">🧩 Puzzle</button>
    <button class="filter-btn" onclick="filterActs('confidence',this)">💪 Confidence</button>
    <button class="filter-btn" onclick="filterActs('calm',this)">😌 Calm</button>
    <button class="filter-btn" onclick="filterActs('play',this)">🎾 Play</button>
  </div>

  <div id="enrich-cards"></div>
</main>

<!-- Runner overlay -->
<div id="activity-runner" class="runner-overlay" style="display:none">
  <div class="runner-box">
    <div class="runner-title" id="runner-title"></div>
    <div class="runner-visual">
      <div class="runner-circle" id="runner-circle"></div>
      <div class="runner-timer"  id="runner-timer">–</div>
    </div>
    <div class="runner-instr" id="runner-instr">Get ready…</div>
    <div class="runner-prog"  id="runner-prog"></div>
    <button class="btn-secondary" id="runner-stop">✓ End Activity</button>
  </div>
</div>

<div id="fp-nav"></div>

<script src="./app-shared.js"></script>
<script>
let currentCat = 'all';

document.addEventListener('DOMContentLoaded', ()=>renderCards('all'));

function filterActs(cat, btn) {
  currentCat = cat;
  qsa('.filter-btn').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderCards(cat);
}

function renderCards(cat) {
  const list = cat==='all' ? ENRICHMENT : ENRICHMENT.filter(e=>e.cat===cat);
  const container = $('enrich-cards');
  container.innerHTML = '';
  list.forEach(e => {
    const done = APP.completedActivities.includes(e.id);
    const div  = document.createElement('div');
    div.className = `enrich-card${done?' done':''}`;
    div.innerHTML = `
      <div class="enrich-icon">${e.icon}</div>
      <div class="enrich-info">
        <h3>${e.name}</h3>
        <p>${e.desc}</p>
        <div class="enrich-meta">
          <span class="enrich-pill">⏱ ${e.time}</span>
          <span class="enrich-pill">${e.level}</span>
        </div>
        <div class="enrich-tip">${e.tip}</div>
      </div>
      <div class="enrich-side">
        ${done ? `<div class="done-badge">✅ Done</div>` : `<button class="btn-start" onclick="startAct('${e.id}')">Start</button>`}
      </div>`;
    container.appendChild(div);
  });
}

function startAct(id) {
  const act = ENRICHMENT.find(e=>e.id===id);
  if (!act) return;
  if (act.instant) { showToast(act.instant); markDone(id); return; }
  runAct(act);
}

function runAct(act) {
  $('runner-title').textContent = act.name;
  $('activity-runner').style.display = 'flex';
  let cycleIdx=0, phaseIdx=0, timer=null;
  const maxCycles = act.cycles||3;

  function runPhase() {
    if (cycleIdx>=maxCycles) { finishAct(act.id); return; }
    const phase = act.phases[phaseIdx%act.phases.length];
    const circle = $('runner-circle');
    circle.className = 'runner-circle '+phase.c;
    $('runner-instr').textContent = phase.l;
    $('runner-prog').textContent  = `Round ${cycleIdx+1} of ${maxCycles}`;
    let t = phase.d; $('runner-timer').textContent = t;
    clearInterval(timer);
    timer = setInterval(()=>{
      t--; $('runner-timer').textContent = t;
      if (t<=0) {
        clearInterval(timer); phaseIdx++;
        if (phaseIdx%act.phases.length===0) cycleIdx++;
        runPhase();
      }
    }, 1000);
  }
  runPhase();

  $('runner-stop').onclick = ()=>{ clearInterval(timer); $('activity-runner').style.display='none'; markDone(act.id); showToast('🎉 Activity complete! +30 XP 🧩'); };
}

function finishAct(id) { $('activity-runner').style.display='none'; markDone(id); showToast('🎉 Activity complete! +30 XP 🧩'); }

function markDone(id) {
  if (APP.addActivity(id)) { save('fp_xp', APP.xp+30); updateXP(); }
  renderCards(currentCat);
}
</script>
</body>
</html>
